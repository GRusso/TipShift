[package]
name = "tipshift-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["legacy"] }
near-contract-standards = "5.30.0"
borsh = "1.5.7"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing", "legacy"] }
